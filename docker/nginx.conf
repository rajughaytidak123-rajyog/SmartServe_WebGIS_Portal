# =============================================================================
# SmartServe GIS - Nginx Reverse Proxy & WebGIS Client Configuration
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # Gzip Compression for JSON, GeoJSON, Vector Tiles, CSS, JS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/geo+json application/x-protobuf application/octet-stream;
    gzip_min_length 1000;

    # Security & CORS Headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

    # 1. Existing Leaflet WebGIS Portal (Default Root: /)
    location / {
        root /usr/share/nginx/html/leaflet;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Modern MapLibre GL JS Vector WebGIS Portal (/maplibre)
    location /maplibre/ {
        alias /usr/share/nginx/html/maplibre/;
        index index.html;
        try_files $uri $uri/ /maplibre/index.html;
    }

    # 3. Static Datasets (GeoJSON, Boundaries, PMTiles Archives)
    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex off;
        # Enable HTTP byte range requests for PMTiles
        slice 0;
        proxy_cache_bypass $http_range;
    }

    # 4. Proxy to FastAPI REST Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Proxy to Backend Health Check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # 6. Proxy to Crunchy pg_tileserv MVT Server
    location /tiles/ {
        proxy_pass http://pg_tileserv:7800/;
        proxy_set_header Host $host;
    }

    # 7. Proxy to Crunchy pg_featureserv OGC API Features
    location /features/ {
        proxy_pass http://pg_featureserv:9000/;
        proxy_set_header Host $host;
    }
}
