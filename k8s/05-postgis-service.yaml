apiVersion: v1
kind: Service
metadata:
  name: smartserve-postgis
  namespace: smartserve-gis
  labels:
    app: smartserve-postgis
    app.kubernetes.io/name: smartserve-postgis
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: smartserve-postgis
---
apiVersion: v1
kind: Service
metadata:
  name: smartserve-postgis-headless
  namespace: smartserve-gis
  labels:
    app: smartserve-postgis
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgresql
  selector:
    app: smartserve-postgis
