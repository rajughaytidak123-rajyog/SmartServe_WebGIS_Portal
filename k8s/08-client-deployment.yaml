apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartserve-client
  namespace: smartserve-gis
  labels:
    app: smartserve-client
    app.kubernetes.io/name: smartserve-client
    app.kubernetes.io/part-of: smartserve-webgis-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartserve-client
  template:
    metadata:
      labels:
        app: smartserve-client
    spec:
      containers:
        - name: web-client
          image: smartserve-client:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
