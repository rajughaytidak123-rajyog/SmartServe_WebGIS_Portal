apiVersion: v1
kind: Secret
metadata:
  name: smartserve-db-secret
  namespace: smartserve-gis
  labels:
    app.kubernetes.io/name: smartserve-db-secret
    app.kubernetes.io/part-of: smartserve-webgis-portal
type: Opaque
stringData:
  POSTGRES_DB: "smartserve_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgresPassword123!"
  DATABASE_URL: "postgresql://postgres:postgresPassword123!@smartserve-postgis:5432/smartserve_db"
